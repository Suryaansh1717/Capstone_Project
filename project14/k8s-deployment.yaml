apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-web-deployment
  labels:
    app: capstone-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-web
  template:
    metadata:
      labels:
        app: capstone-web
    spec:
      containers:
      - name: capstone-web
        image: 590507089733.dkr.ecr.ap-south-1.amazonaws.com/suryaansh-capstone-app:v1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-web-service
spec:
  type: LoadBalancer
  selector:
    app: capstone-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
