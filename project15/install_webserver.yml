---
- name: Configure Web Server using Ansible
  hosts: webservers
  become: yes

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx web server
      apt:
        name: nginx
        state: present

    - name: Deploy custom Capstone index.html
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Capstone Project 15 - Ansible</title></head>
          <body style="font-family: Arial, sans-serif; text-align: center; margin-top: 60px;">
            <h1>Automated Web Server Configured via Ansible</h1>
            <p>Deployed by Suryaansh Dev | Capstone Project 15</p>
          </body>
          </html>
        mode: '0644'

    - name: Ensure Nginx service is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes
